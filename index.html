<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,
            user-scalable=no">
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>
    <!-- 外部pyscript -->
    <script type="mpy" src="main.py"></script>
    <script type="mpy" src="click.py"></script>
</head>

<!-- ゲーム画面 -->

<body style="text-align:center;">
    <h1 id="info" style="color:brown;">もぐらたたきゲーム</h1>
    <!-- ゲーム開始ボタン -->
    <button id="start_button"
        mpy-click="start_button_on_click">ゲームスタート</button>
    <br><br>
    <!-- ゲーム画面Canvas要素 -->
    <canvas id="canvas" width="600" height="400"
       mpy-click="canvas_on_click"
       style="border:1px solid black;"></canvas>
    <!-- 画像を読み込む -->
    <img id="mogura_img" src="mogura.png" style="display:none;">
    <img id="hatake_img" src="hatake.png" style="display:none;">
</body>
</html>
